name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [22.22.2, 24.18.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Audit locked dependencies
        if: matrix.node == '24.18.0'
        run: npm audit
      - name: Audit runtime dependencies
        if: matrix.node == '24.18.0'
        run: npm audit --omit=dev
      - name: Validate and package
        if: matrix.node == '24.18.0'
        run: npm run ci
      - name: Validate alternate build engine
        if: matrix.node == '22.22.2'
        run: npm run check
      - name: Qualify packaged ARI dependencies
        if: matrix.node == '24.18.0'
        run: npm run test:ari-runtime -- --production-executable out/nova-chat-win32-x64/nova-chat.exe
